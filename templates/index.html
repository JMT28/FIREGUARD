<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - FIREGUARD</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #007000;
      font-family: sans-serif;
    }

    #map {
      width: 95%;
      height: 450px;
      border-radius: 8px 8px 0 0;
    }

    .retangulo-abaixo {
      width: 95%;
      height: 350px;
      background-color: #005000;
      border-radius: 0 0 8px 8px;
      padding: 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: row;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn {
      background-color: #00ff50;
      color: white;
      border: none;
      border-radius: 6px;
      width: 65px;
      height: 35px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .btn:hover {
      background-color: #00ff85;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="retangulo-abaixo">
    <a href="#"><button class="btn">Mapa</button></a>
    <a href="/risco"><button class="btn">Risco</button></a>
    <a href="/fauna-flora"><button class="btn">Fauna e flora</button></a>     
    <a href="/incendio"><button class="btn">Relatar</button></a>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const latPadrao = -22.2819;
    const lngPadrao = -42.5311;

    const map = L.map('map').setView([latPadrao, lngPadrao], 11);

    // Mapa Topográfico (Destaca áreas verdes e parques nativamente)
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: 'OpenTopoMap'
    }).addTo(map);

    // GPS do Usuário
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(function (pos) {
        map.setView([pos.coords.latitude, pos.coords.longitude], 11);
        L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map).bindPopup("Sua Localização").openPopup();
      });
    }
  </script>

</body>
</html>
