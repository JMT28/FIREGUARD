<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatar incêndio - FIREGUARD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
      font-family: sans-serif;
    }
    .btn-voltar {
      position: absolute;
      top: 15px;
      left: 15px;
      background-color: #005000;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: background-color 0.2s;
    }

    .btn-voltar:hover {
      background-color: #00ff50;
      color: #000000;
    }
    .relatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-color: #ff0000;
      color: #ffffff;
      border: none;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .relatar:hover {
      background-color: #cc0000;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <a href="tel:193"><button class="relatar">Relatar<br>Incêndio</button></a>
  <!-- Botão Voltar -->
  <a href="/" class="btn-voltar">&larr; Voltar</a>
</body>
</html>
